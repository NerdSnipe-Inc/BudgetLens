name: BudgetLens
options:
  bundleIdPrefix: com.nerdsnipe
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  # DesignFoundationPro is a private, licensed package (github.com/NerdSnipe-Inc/DesignFoundationPro),
  # and that's the intentional gate: the source here is meant to be read and learned from by anyone,
  # but SwiftPM can only resolve this dependency — and the project only builds — for someone whose
  # GitHub account has been granted access to that private repo. Everyone else gets a clean
  # "repository not found" from SwiftPM rather than a build that silently can't work.
  DesignFoundationPro:
    url: https://github.com/NerdSnipe-Inc/DesignFoundationPro.git
    from: 2.4.0
  DesignFoundation:
    url: https://github.com/NerdSnipe-Inc/design-foundation.git
    from: 1.8.0
targets:
  BudgetLens:
    type: application
    platform: iOS
    sources:
      - BudgetLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nerdsnipe.budgetlens
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QW2MDLZZJH
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BudgetLens
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: DesignFoundation
      - package: DesignFoundationPro
  BudgetLensMac:
    type: application
    platform: macOS
    sources:
      - BudgetLens
    settings:
      base:
        PRODUCT_NAME: BudgetLens
        PRODUCT_BUNDLE_IDENTIFIER: com.nerdsnipe.budgetlens
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QW2MDLZZJH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BudgetLens
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 NerdSnipe Inc."
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
    dependencies:
      - package: DesignFoundation
      - package: DesignFoundationPro
  BudgetLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BudgetLensTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BudgetLens
  BudgetLensMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BudgetLensTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetLens.app/Contents/MacOS/BudgetLens"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: BudgetLensMac
schemes:
  BudgetLens:
    build:
      targets:
        BudgetLens: all
    test:
      targets:
        - BudgetLensTests
  BudgetLensMac:
    build:
      targets:
        BudgetLensMac: all
    test:
      targets:
        - BudgetLensMacTests
